<h2 mat-dialog-title>{{ 'events.publish.title' | transloco }}</h2>

<mat-dialog-content> {{ 'events.publish.message' | transloco }} </mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()" class="cancel-button">
    {{ 'events.publish.cancel' | transloco }}
  </button>

  <button mat-stroked-button (click)="confirm()" class="confirm-button">
    {{ 'events.publish.confirm' | transloco }}
  </button>
</mat-dialog-actions>
