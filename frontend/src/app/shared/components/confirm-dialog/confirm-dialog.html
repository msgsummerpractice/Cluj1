<h2 mat-dialog-title>{{ data.titleKey | transloco }}</h2>

<mat-dialog-content> {{ data.messageKey | transloco }} </mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()" class="cancel-button">
    {{ data.cancelKey | transloco }}
  </button>

  <button mat-stroked-button (click)="confirm()" class="confirm-button">
    {{ data.confirmKey | transloco }}
  </button>
</mat-dialog-actions>
