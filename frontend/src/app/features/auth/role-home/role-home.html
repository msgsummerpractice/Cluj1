<div
  class="min-h-screen bg-[linear-gradient(180deg,#ffffff_0%,#f6f8fb_100%)] px-4 py-8 sm:px-6 lg:px-8"
>
  <div class="mx-auto max-w-6xl flex flex-col">
    <section
      class="flex flex-col overflow-hidden rounded-2xl bg-[linear-gradient(135deg,#8b143d_0%,#d45c82_50%,#f5b9cb_100%)] px-6 py-8 text-white shadow-[0_24px_80px_rgba(33,40,60,0.18)] sm:rounded-[2rem] sm:px-10 sm:py-12 lg:px-12 lg:py-16"
    >
      <p class="mb-3 text-xs uppercase tracking-[0.2em] text-white/75 sm:mb-4 sm:text-sm">
        {{ 'roles.welcome' | transloco }}
      </p>
      <h1 class="m-0 max-w-3xl text-3xl leading-tight sm:text-4xl lg:text-5xl">
        {{ roleLabel() }} {{ 'roles.workspace' | transloco }}
      </h1>
      <p class="mt-3 max-w-2xl text-base text-white/85 sm:mt-4 sm:text-lg">
        {{ roleSummary() }}
      </p>
    </section>
    <section class = "flex items-center justify-center">
      <app-rubiks-cube-component></app-rubiks-cube-component>
    </section>
  </div>
</div>
