<div
  class="flex min-h-full flex-col bg-[linear-gradient(180deg,#ffffff_0%,#f6f8fb_100%)] px-4 py-4 sm:px-6 sm:py-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-6xl flex-1 flex-col gap-4">
    <section
      class="flex shrink-0 flex-col overflow-hidden rounded-2xl bg-[linear-gradient(135deg,#8b143d_0%,#d45c82_50%,#f5b9cb_100%)] px-6 py-6 text-white shadow-[0_24px_80px_rgba(33,40,60,0.18)] sm:rounded-[2rem] sm:px-10 sm:py-8 lg:px-12 lg:py-10"
    >
      <p class="mb-2 text-xs uppercase tracking-[0.2em] text-white/75 sm:mb-3 sm:text-sm">
        {{ 'roles.welcome' | transloco }}
      </p>
      <h1 class="m-0 max-w-3xl text-2xl leading-tight sm:text-3xl lg:text-4xl">
        {{ roleLabel() }} {{ 'roles.workspace' | transloco }}
      </h1>
      <p class="mt-2 max-w-2xl text-sm text-white/85 sm:mt-3 sm:text-base lg:text-lg">
        {{ roleSummary() }}
      </p>
    </section>
    <section class="flex flex-1 items-center justify-center">
      <app-rubiks-cube-component></app-rubiks-cube-component>
    </section>
  </div>
</div>
