<div class="user-list-wrapper">
  <div class="user-list-header flex justify-between items-center mb-6">
    <h2 class="user-list-title text-3xl font-bold text-gray-800 m-0">
      {{ 'userList.title' | transloco }}
    </h2>

    <mat-form-field appearance="outline" class="w-full sm:w-80">
      <mat-label>{{ 'userList.searchLabel' | transloco }}</mat-label>
      <input
        matInput
        [formControl]="searchControl"
        [placeholder]="'userList.searchPlaceholder' | transloco"
      />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-container">
    <app-data-table
      [data]="users()"
      [columns]="tableColumns"
      [showPaginator]="true"
      [pageSizeOptions]="[10, 25, 50]"
      [noDataLabel]="'userList.noData'"
      [noDataDetail]="searchControl.value || ''"
    >
      <ng-template appDataTableCellDef="location" let-user>
        {{ formatLocation(user.location) }}
      </ng-template>

      <ng-template appDataTableCellDef="role" let-user>
        <span
          class="role-badge"
          [ngClass]="{
            'role-admin': user.role === 'ADMIN',
            'role-standard': user.role !== 'ADMIN',
          }"
        >
          {{ user.role | roleTitlecase }}
        </span>
      </ng-template>

      <ng-template appDataTableCellDef="isActive" let-user>
        <div class="status-wrapper">
          <mat-slide-toggle
            [checked]="user.isActive"
            (change)="toggleStatus(user, $event)"
            class="custom-warn-toggle"
          >
          </mat-slide-toggle>
          <span
            [ngClass]="{
              'status-text-active': user.isActive,
              'status-text-inactive': !user.isActive,
            }"
          >
            {{
              user.isActive
                ? ('userList.statusActive' | transloco)
                : ('userList.statusInactive' | transloco)
            }}
          </span>
        </div>
      </ng-template>

      <ng-template appDataTableCellDef="actions" let-user>
        <button
          mat-icon-button
          (click)="manageRole(user)"
          [matTooltip]="'userList.manageUsers' | transloco"
          matTooltipPosition="above"
          aria-label="Manage user role"
        >
          <mat-icon>manage_accounts</mat-icon>
        </button>
      </ng-template>
    </app-data-table>
  </div>
</div>
