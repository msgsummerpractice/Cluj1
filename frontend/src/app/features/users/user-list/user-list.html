<div class="p-8 bg-white min-h-screen">
  <app-data-table
    [columns]="columns"
    [data]="users"
    title="userList.title"
    noDataLabel="userList.noData"
    [noDataDetail]="searchTerm"
  >
    <mat-form-field dataTableActions appearance="outline" class="w-80">
      <mat-label>{{ 'userList.searchLabel' | transloco }}</mat-label>
      <input
        matInput
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearch($event)"
        [placeholder]="'userList.searchPlaceholder' | transloco"
      />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <ng-template appDataTableCellDef="role" let-user>
      <mat-chip-set>
        <mat-chip highlighted color="primary">{{ user.role }}</mat-chip>
      </mat-chip-set>
    </ng-template>

    <ng-template appDataTableCellDef="location" let-user>
      {{ user.location | titlecase }}
    </ng-template>

    <ng-template appDataTableCellDef="isActive" let-user>
      <span
        [ngClass]="{
          'text-green-600 font-medium': user.isActive,
          'text-red-500 font-medium': !user.isActive,
        }"
      >
        {{
          user.isActive
            ? ('userList.statusActive' | transloco)
            : ('userList.statusInactive' | transloco)
        }}
      </span>
    </ng-template>

    <ng-template appDataTableCellDef="actions" let-user>
      <button mat-flat-button (click)="manageRole(user.id)" class="user-manage-button">
        <mat-icon>manage_accounts</mat-icon>
        {{ 'userList.manageRole' | transloco }}
      </button>
    </ng-template>
  </app-data-table>
</div>
