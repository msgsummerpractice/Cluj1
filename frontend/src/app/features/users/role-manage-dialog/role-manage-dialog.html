<div class="dialog-container">
  <button mat-icon-button class="close-button" (click)="onCancel()">
    <mat-icon>close</mat-icon>
  </button>

  <h2 class="dialog-title">
    {{ 'roleManageDialog.title' | transloco }}
  </h2>

  <p class="dialog-subtitle">
    {{ data.user.firstName }} {{ data.user.lastName }} —
    <span class="user-email">{{ data.user.email }}</span>
  </p>

  <mat-form-field appearance="outline" class="role-form-field">
    <mat-label class="role-label">
      {{ 'roleManageDialog.platformRole' | transloco }}
    </mat-label>
    <mat-select [(ngModel)]="selectedRole" panelClass="custom-select-panel">
      <mat-option *ngFor="let role of roles" [value]="role">
        {{ role.replace('_', ' ') | titlecase }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <div class="actions-container">
    <button mat-stroked-button (click)="onCancel()" class="btn-cancel">
      {{ 'roleManageDialog.cancel' | transloco }}
    </button>
    <button mat-flat-button (click)="onSave()" class="btn-save">
      {{ 'roleManageDialog.save' | transloco }}
    </button>
  </div>
</div>
