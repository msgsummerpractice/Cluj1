<div class="p-8 bg-white min-h-screen">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-3xl font-bold text-gray-800 m-0">Event Management</h2>
  </div>

  <div class="mat-elevation-z2 rounded-lg overflow-hidden border border-gray-200">
    <table
      mat-table
      matSort
      [dataSource]="dataSource"
      (matSortChange)="handleSortChange($event)"
      class="w-full"
    >
      <ng-container matColumnDef="name">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header="name"
          class="font-semibold text-gray-700 bg-gray-50"
        >
          Name
        </th>
        <td mat-cell *matCellDef="let event">{{ event.name }}</td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header="startDate"
          class="font-semibold text-gray-700 bg-gray-50"
        >
          Date
        </th>
        <td mat-cell *matCellDef="let event">
          {{ event.startDate | date: 'mediumDate' }}
          @if (shouldShowEndDate(event)) {
            <span> - {{ event.endDate | date: 'mediumDate' }} </span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header="status"
          class="font-semibold text-gray-700 bg-gray-50"
        >
          Status
        </th>
        <td mat-cell *matCellDef="let event">
          <span
            class="status-badge px-3 py-1.5 text-xs font-medium rounded-full border inline-block whitespace-nowrap"
            [ngClass]="getStatusBadgeClass(event.status)"
          >
            {{ event.status }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header="type"
          class="font-semibold text-gray-700 bg-gray-50"
        >
          Type
        </th>
        <td mat-cell *matCellDef="let event" class="text-gray-600">{{ event.type }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="text-center font-semibold text-gray-700 bg-gray-50"
        >
          Actions
        </th>
        <td mat-cell *matCellDef="let event" class="text-center">
          <button
            mat-stroked-button
            (click)="manageEvent(event.id)"
            class="event-view-button transition-colors whitespace-nowrap"
          >
            View
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="hover:bg-gray-50 transition-colors"
      ></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell text-center py-8 text-gray-500" colspan="5">No events found</td>
      </tr>
    </table>
  </div>
</div>
